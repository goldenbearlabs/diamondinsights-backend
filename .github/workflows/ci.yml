name: CI (Tests)

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/backend.txt
          pip install -r requirements/jobs.txt
          pip install -r requirements/scheduler.txt
          pip install -r requirements/test.txt

      - name: Compile Python modules
        run: |
          python -m compileall shared apps/backend/src apps/jobs apps/scheduler

      - name: Run shared unit tests
        run: |
          python -m pytest -c shared/pytest.ini -q shared/tests/unit
