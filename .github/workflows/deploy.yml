name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            cd /opt/di

            git fetch --prune origin main
            git reset --hard origin/main

            docker compose -f infra/docker/docker-compose.server.yml --env-file .env down --remove-orphans
            docker compose -f infra/docker/docker-compose.server.yml --env-file .env up -d --build --remove-orphans
            docker image prune -f
