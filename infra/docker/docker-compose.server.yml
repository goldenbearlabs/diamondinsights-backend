services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    working_dir: /app
    image: mlb_backend_image
    restart: unless-stopped
    volumes:
      - ../../apps/backend/src:/app/src
      - ../../apps/backend/alembic:/app/alembic
      - ../../apps/backend/alembic.ini:/app/alembic.ini
      - ../../shared:/app/shared
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase_service_key
      TZ: America/Vancouver
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app/src:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network
    command: bash -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    secrets:
      - firebase_service_key

  scheduler:
    build:
      context: ../..
      dockerfile: apps/scheduler/Dockerfile
    working_dir: /app
    restart: unless-stopped
    environment:
      TZ: America/Vancouver
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONPATH: /app/shared:/app/apps/scheduler
    depends_on:
      redis:
        condition: service_started
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app_network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app_network

  portainer:
    image: portainer/portainer-ce:latest
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9001:9000"
    networks:
      - app_network

networks:
  app_network:
    name: app_network
    driver: bridge

volumes:
  postgres_data:
  portainer_data:
  redis_data:
  caddy_data:
  caddy_config:

secrets:
  firebase_service_key:
    file: ../../secrets/firebase_service_key.json
